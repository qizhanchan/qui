<!doctype html><style>
@font-face{font-family:GoRegular;src:url(../../../widgets/scripts/web/go-regular.ttf)}
body{margin:0;font:16px/20px GoRegular} x-filter{width:240px}
</style><x-filter id="host"><template shadowrootmode="open"><style>
