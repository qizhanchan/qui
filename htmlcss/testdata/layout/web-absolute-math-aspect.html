<!doctype html><html><head><style>
@font-face {font-family:GoRegular;src:url("../../../widgets/scripts/web/go-regular.ttf")}
body{margin:0;font:16px GoRegular}
.host{position:relative;width:200px;background:#eee}
.icon{position:absolute;left:50%;top:50%;height:min(50px,70%);width:auto;aspect-ratio:1/1;transform:translate(-50%,-50%);background:black;border-radius:50%}
</style></head><body><div class="host" style="height:30px"><span id="small" class="icon"></span></div><div class="host" style="height:200px"><span id="large" class="icon"></span></div><div class="host" style="height:80px"><span id="margin" style="position:absolute;left:-6px;top:-6px;margin-left:50%;margin-top:10%;width:12px;height:12px;background:blue"></span></div><span id="fixed-margin" style="position:fixed;left:0;top:0;margin-left:50%;margin-top:10%;width:12px;height:12px;background:red"></span></body></html>
