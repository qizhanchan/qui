<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>qui</title>
</head>
<body>
<!-- The web backend draws the app's first window into #qui and sizes it
     to the viewport; without it, it creates its own canvas. -->
<canvas id="qui"></canvas>
<script src="wasm_exec.js"></script>
<script>
const go = new Go();
// no-cache: revalidate on every load (a 304 when unchanged), so a rebuilt
// app.wasm is never shadowed by the browser's heuristic cache.
WebAssembly.instantiateStreaming(fetch("app.wasm", {cache: "no-cache"}), go.importObject)
  .then(r => go.run(r.instance))
  .catch(e => { document.body.textContent = String(e); console.error(e); });
</script>
</body>
</html>
